name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Vinissia APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK & Prepare Asset
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/vinissia.apk
          mkdir -p public/downloads
          cp dist-apk/vinissia.apk public/downloads/vinissia.apk
          mkdir -p private
          cp dist-apk/vinissia.apk private/vinissia.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinissia-apk
          path: dist-apk/vinissia.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "ألبان فينيسيا — تطبيق الأندرويد الرسمي"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🥛 تطبيق ألبان فينيسيا (Venice Dairy) الرسمي للأندرويد
            
            تطبيق الهاتف المحمول الرسمي لـ **معمل ومصنع ألبان فينيسيا** بحدائق القبة ومصر الجديدة.
            
            ### 🔥 مميزات التطبيق:
            - تصفح كامل لقائمة المنتجات (ألبان فلاحي، أجبان معتقة، زبادي بلدي ويوناني، حلويات فاخرة، عسل نحل طبيعي).
            - طلب دليفري فوري وحساب مصاريف الشحن التلقائية حسب المنطقة.
            - تتبع لحظي لحالة الطلب عبر الـ GPS المباشر من خروج الأوردر حتى باب بيتك.
            - شات مباشر داخل النظام مع المحل والطيار.
            - وصول سريع لبوابة الإدارة والكاشير والطيارين.
            
            ### 📲 طريقة التثبيت:
            1. اضغط على رابط التحميل بالأسفل `vinissia.apk`.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. تطبيق مستقل وخاص بألبان فينيسيا (`com.vinissia.app`).
          files: dist-apk/vinissia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/downloads/vinissia.apk private/vinissia.apk
          git commit -m "chore(apk): update official vinissia.apk build [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
